<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0d0624"/><title>VendiPort — Get started</title><link rel="icon" href="/favicon.png"/>
<style>
*{box-sizing:border-box;margin:0}body{min-height:100vh;font-family:system-ui,Arial,sans-serif;color:#fff;text-align:center;
background:radial-gradient(ellipse at 50% 20%,#2a1060 0,#0d0624 50%,#03020a 90%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 18px}
.logo{width:min(280px,75vw);filter:drop-shadow(0 0 10px #00e5e588)}
h1{font-size:26px;font-weight:900;margin:12px 0 4px;text-shadow:0 0 12px #b46bff}
.ban{display:inline-block;margin:6px 0 4px;padding:6px 16px;border-radius:10px;font-weight:900;letter-spacing:.5px;background:linear-gradient(90deg,#7a1fe0,#2b6fe0 50%,#00c8c8);box-shadow:0 0 18px #2ee6e6}
p{color:#2ee6e6;font-weight:700;font-size:14px;margin:8px 0 22px;text-shadow:0 0 6px #00e5e5}
a.btn{display:block;width:min(360px,100%);margin:0 auto 16px;padding:22px 16px;border-radius:18px;text-decoration:none;color:#fff;font-size:22px;font-weight:900;background:#0b0620;border:3px solid #00e5e5;box-shadow:0 0 18px #00e5e5,inset 0 0 14px #8a2be2aa}
a.btn small{display:block;font-size:13px;font-weight:600;color:#ccc;margin-top:6px}
a.shop{border-color:#b46bff;box-shadow:0 0 18px #b46bff,inset 0 0 14px #00e5e566}
</style></head><body>
<img class="logo" src="/img/logo-lockup.png" alt="VendiPort"/>
<h1>Buy and sell with us</h1><div class="ban">SAME-DAY DELIVERY</div>
<p>Connect with local hobby stores for same-day delivery</p>
<a class="btn" href="/" id="collector">🛒 I'm a collector (buy)<small>Open the virtual vending machine</small></a>
<a class="btn shop" href="/shop.html" id="shop">🏪 I'm a card shop (sell)<small>List sealed product &amp; fill orders</small></a>
</body></html>
